name: Supabase Database KeepAlive Daily CronJob

on:
  schedule:
    # Runs daily at 07:15 WIB (00:15 UTC)
    - cron: '15 0 * * *'
  workflow_dispatch: # Manual trigger capability from GitHub Actions UI

jobs:
  keepalive-ping:
    name: Daily Supabase Database Keep-Alive
    runs-on: ubuntu-latest

    steps:
      - name: 📡 Execute 3-Point Keep-Alive Database Queries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          APP_URL: "https://chatbotgk.vercel.app"
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ ERROR: Secrets SUPABASE_URL or SUPABASE_ANON_KEY are missing in GitHub Secrets!"
            exit 1
          fi

          echo "🚀 Starting Daily Keep-Alive Job at $(date -u) (07:15 WIB schedule)..."

          # ----------------------------------------------------
          # Query 1: Supabase Profiles Table Ping
          # ----------------------------------------------------
          echo "🔹 [Query 1/3] Pinging Supabase REST API (Profiles Table)..."
          HTTP_STATUS_1=$(curl -s -o /dev/null -w "%{http_code}" \
            --fail --retry 3 --retry-delay 2 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")

          echo "Status 1: $HTTP_STATUS_1"
          if [ "$HTTP_STATUS_1" -ne 200 ] && [ "$HTTP_STATUS_1" -ne 206 ]; then
            echo "❌ FAILED: Query 1 returned invalid status code $HTTP_STATUS_1 (Expected 200/206)"
            exit 1
          fi

          echo "⏳ Waiting 3 seconds..."
          sleep 3

          # ----------------------------------------------------
          # Query 2: Supabase Document Chunks Table Ping
          # ----------------------------------------------------
          echo "🔹 [Query 2/3] Pinging Supabase REST API (Document Chunks Table)..."
          HTTP_STATUS_2=$(curl -s -o /dev/null -w "%{http_code}" \
            --fail --retry 3 --retry-delay 2 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/document_chunks?select=id&limit=1")

          echo "Status 2: $HTTP_STATUS_2"
          if [ "$HTTP_STATUS_2" -ne 200 ] && [ "$HTTP_STATUS_2" -ne 206 ]; then
            echo "❌ FAILED: Query 2 returned invalid status code $HTTP_STATUS_2 (Expected 200/206)"
            exit 1
          fi

          echo "⏳ Waiting 3 seconds..."
          sleep 3

          # ----------------------------------------------------
          # Query 3: Dedicated Next.js Health Check Endpoint
          # ----------------------------------------------------
          echo "🔹 [Query 3/3] Pinging Next.js Dedicated Health Endpoint (/api/health)..."
          HTTP_STATUS_3=$(curl -s -o /dev/null -w "%{http_code}" \
            --fail --retry 3 --retry-delay 2 \
            "$APP_URL/api/health")

          echo "Status 3: $HTTP_STATUS_3"
          if [ "$HTTP_STATUS_3" -ne 200 ] && [ "$HTTP_STATUS_3" -ne 206 ]; then
            echo "❌ FAILED: Query 3 returned invalid status code $HTTP_STATUS_3 (Expected 200/206)"
            exit 1
          fi

          echo "🎉 SUCCESS: All 3 keep-alive queries completed with valid HTTP 200/206 status!"
